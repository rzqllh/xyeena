name: Veyra v1.0 Full Matrix Verification

on:
  push:
    branches: [ main, veyra-review, release/** ]
  pull_request:
    branches: [ main, veyra-review ]
  workflow_dispatch:

jobs:
  test-matrix:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Frozen Upstream Lockfile Metadata (source contents not checked)
        run: npm run preflight:metadata

      - name: Full Upstream Source Integrity Gate (release branches only)
        if: startsWith(github.ref, 'refs/heads/release/')
        run: npm run preflight:recover && npm run preflight

      - name: Run Full Test Suite
        run: npm test

      - name: Test Veyra CLI Installation & Verification
        run: |
          node bin/veyra.mjs install --target ./cli-test-target
          node bin/veyra.mjs verify --target ./cli-test-target
          node bin/veyra.mjs uninstall --target ./cli-test-target
          node bin/veyra.mjs license-audit
