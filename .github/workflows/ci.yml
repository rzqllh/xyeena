name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.14.0, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:harness
      - run: npm run test:consumer
      - run: npm run check
      - run: npm run eval
      - run: npm pack --dry-run
      - name: Windows acceptance pack read-only smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP ('xyeena-pack-' + [guid]::NewGuid().ToString('N'))
          pwsh -NoProfile -File scripts/windows-acceptance-pack.ps1 -RepoDir . -UseCurrentSource -OutputDir $dest
          if ($LASTEXITCODE -ne 0) { throw 'Windows acceptance pack failed' }
          $report = Get-Content -Raw (Join-Path $dest 'rig-windows-evidence.json') | ConvertFrom-Json
          if ($report.verdict -ne 'SOURCE_PREFLIGHT_PASS_LIVE_PENDING' -or
              $report.project -ne 'xyeena-rig' -or
              $report.acceptanceScope -ne 'rig-native-hosts' -or
              $report.nativeAcceptance.PSObject.Properties.Name -contains 'simpul' -or
              ($report.preflight.remainingGates | Where-Object { $_.issue -eq 35 }) -or
              $report.existingCheckoutUnchanged -ne $true -or
              $report.preflight.modelCallPerformed -ne $false) {
            throw 'Windows acceptance report made an unsupported claim'
          }
      - name: Windows PowerShell 5.1 detached-worktree preflight
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Exercise the non-UseCurrentSource path under legacy powershell.exe,
          # including git fetch/worktree stderr progress, as on the owner's PC.
          $dest = Join-Path $env:RUNNER_TEMP ('xyeena-ps51-' + [guid]::NewGuid().ToString('N'))
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows-acceptance-pack.ps1 -RepoDir . -OutputDir $dest
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 detached-worktree preflight failed' }
          $report = Get-Content -Raw (Join-Path $dest 'rig-windows-evidence.json') | ConvertFrom-Json
          if ($report.verdict -ne 'SOURCE_PREFLIGHT_PASS_LIVE_PENDING' -or
              $report.project -ne 'xyeena-rig' -or
              $report.acceptanceScope -ne 'rig-native-hosts' -or
              $report.nativeAcceptance.PSObject.Properties.Name -contains 'simpul' -or
              ($report.preflight.remainingGates | Where-Object { $_.issue -eq 35 }) -or
              $report.existingCheckoutUnchanged -ne $true -or
              $report.preflight.modelCallPerformed -ne $false -or
              $report.preflight.guidedHook.hostEnforcement -ne 'UNVERIFIED') {
            throw 'Windows PowerShell 5.1 preflight reported unsupported evidence'
          }
  skills-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref'
      - run: |
          for d in skills/*; do
            [ -d "$d" ] && skills-ref validate "$d"
          done


  sdk-worker-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile standalone Python SDK worker
        run: python -m py_compile bridges/antigravity-sdk-worker.py
      - name: Reject unsafe SDK tasks without invoking the SDK
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          payload = {
              "cwd": ".",
              "task": {"id": "test", "title": "Reject unsafe task",
                       "scope": {"readOnly": False, "operationClass": "safe"}},
              "skillPaths": [],
          }
          proc = subprocess.run(
              [sys.executable, "bridges/antigravity-sdk-worker.py"],
              input=json.dumps(payload) + "\n", text=True, capture_output=True, timeout=5
          )
          assert proc.returncode != 0, "unsafe task should be rejected"
          out = json.loads(proc.stdout)
          assert out["ok"] is False
          assert "read-only" in out["error"]
          assert not proc.stderr
          PY

  npx-github-smoke:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
      - name: Create disposable workspace
        shell: pwsh
        run: New-Item -ItemType Directory -Path rig-smoke -Force | Out-Null
      - name: Smoke test GitHub tarball via npx
        shell: pwsh
        working-directory: rig-smoke
        run: |
          $package = "https://codeload.github.com/rzqllh/xyeena/tar.gz/${{ github.event.pull_request.head.sha }}"
          npx --yes --package $package xyeena version
          if ($LASTEXITCODE -ne 0) { throw 'GitHub npx execution failed' }
          npx --yes --package $package xyeena guided preview --dir .
          if ($LASTEXITCODE -ne 0) { throw 'Guided preview failed' }
          if (Test-Path '.agents/hooks.json') { throw 'Preview modified the workspace' }
          npx --yes --package $package xyeena guided install --dir . --yes
          if ($LASTEXITCODE -ne 0) { throw 'Guided install failed' }
          if (-not (Test-Path '.agents/hooks.json')) { throw 'Hooks were not installed' }
          npx --yes --package $package xyeena guided status --dir .
          if ($LASTEXITCODE -ne 0) { throw 'Guided status failed' }
          npx --yes --package $package xyeena guided uninstall --dir . --yes
          if ($LASTEXITCODE -ne 0) { throw 'Guided uninstall failed' }
          if (Test-Path '.agents/hooks.json') { throw 'Uninstall left the managed config behind' }
          npx --yes --package $package xyeena setup --runtime "hermes,gemini" --preset essential --dry-run
          if ($LASTEXITCODE -ne 0) { throw 'Beginner setup preview failed' }
          if (Test-Path '.hermes/skills/xyeena-orchestrate/SKILL.md') { throw 'Setup preview wrote files' }
          npx --yes --package $package xyeena setup --runtime "hermes,gemini" --preset essential --yes
          if ($LASTEXITCODE -ne 0) { throw 'Beginner setup failed' }
          if (-not (Test-Path '.hermes/skills/xyeena-orchestrate/SKILL.md')) { throw 'Hermes orchestrator missing' }
          if (-not (Test-Path '.gemini/skills/xyeena-orchestrate/SKILL.md')) { throw 'Gemini orchestrator missing' }
          if (Test-Path 'AGENTS.md') { throw 'Beginner setup modified root AGENTS.md' }
          $target = '.hermes/skills/xyeena-orchestrate/SKILL.md'
          Add-Content -Path $target -Value 'CUSTOM-XYEENA-UPGRADE-SMOKE'
          npx --yes --package $package xyeena setup --runtime hermes --preset essential --update --dry-run
          if ($LASTEXITCODE -ne 0) { throw 'Beginner update preview failed' }
          if (-not (Select-String -Path $target -Pattern 'CUSTOM-XYEENA-UPGRADE-SMOKE' -Quiet)) { throw 'Dry-run replaced a custom skill' }
          npx --yes --package $package xyeena setup --runtime hermes --preset essential --update --yes
          if ($LASTEXITCODE -ne 0) { throw 'Beginner update failed' }
          if (Select-String -Path $target -Pattern 'CUSTOM-XYEENA-UPGRADE-SMOKE' -Quiet) { throw 'Upgrade did not replace old skill' }
          $copies = @(Get-ChildItem -Path '.xyeena/backups' -Recurse -Filter 'SKILL.md' -File)
          if (-not ($copies | Where-Object { Select-String -Path $_.FullName -Pattern 'CUSTOM-XYEENA-UPGRADE-SMOKE' -Quiet })) {
            throw 'Upgrade did not back up custom skill'
          }
          # Exercise actual packed compact install and host health on Windows.
          npx --yes --package $package xyeena setup compact --runtime codex --preset balanced --dry-run | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Compact setup preview failed' }
          if (Test-Path '.agents/skills/xyeena-rig/SKILL.md') { throw 'Compact preview wrote to disk' }
          npx --yes --package $package xyeena setup compact --runtime codex --preset balanced --yes | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Packed compact setup failed' }
          if (-not (Test-Path '.agents/skills/xyeena-rig/SKILL.md')) { throw 'Compact orchestrator entry missing' }
          $compactHealth = npx --yes --package $package xyeena setup check --runtime codex --local-only | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $compactHealth.filesystem.orchestratorName -ne 'xyeena-rig') {
            throw 'Compact entry not recognized by runtime health check'
          }
          $backups = @(npx --yes --package $package xyeena setup backups | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or -not $backups) { throw 'Could not list rollback backups' }
          $id = $backups[0].id
          $rollbackPreview = npx --yes --package $package xyeena setup rollback --id $id --dry-run | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $rollbackPreview.available) { throw 'Rollback preview failed' }
          npx --yes --package $package xyeena setup rollback --id $id --yes
          if ($LASTEXITCODE -ne 0) { throw 'Rollback execution failed' }
          if (-not (Select-String -Path $target -Pattern 'CUSTOM-XYEENA-UPGRADE-SMOKE' -Quiet)) {
            throw 'Rollback did not restore customized SKILL.md'
          }
