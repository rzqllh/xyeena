name: publish
on:
  release:
    types: [published]
  # One-time, approved v0.3.0 publish after PR #12 is merged to main.
  # Future versions continue to use the ordinary GitHub Release trigger.
  push:
    branches: [main]
    paths: [package.json, .github/workflows/publish.yml]
permissions:
  contents: read
  id-token: write
concurrency:
  group: xyeena-npm-publish
  cancel-in-progress: false
jobs:
  npm:
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'release: xyeena-agent v0.3.0') || startsWith(github.event.head_commit.message, 'verify: xyeena-agent v0.3.0')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - name: Validate release event and package version
        run: |
          set -eu
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
              echo "::error::Release tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION"
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$PACKAGE_VERSION" != "0.3.0" ]; then
              echo "::error::One-time main-branch publish is limited to v0.3.0"
              exit 1
            fi
          else
            echo "::error::Unexpected publish event"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run test:harness
      - run: npm run test:consumer
      - run: npm run check
      - run: npm run eval
      - run: npm pack --dry-run
      - name: Check exact npm version availability
        id: existing
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view "xyeena-agent@$VERSION" version --registry=https://registry.npmjs.org/ 2>/dev/null | grep -Fx "$VERSION"; then
            echo "Version $VERSION is already published; will not overwrite it."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate to npm registry
        if: steps.existing.outputs.published != 'true' && !startsWith(github.event.head_commit.message, 'verify: xyeena-agent v0.3.0')
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "Using NPM_TOKEN secret from GitHub repository."
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > "$HOME/.npmrc"
            echo "Successfully configured ~/.npmrc with NPM_TOKEN."
          else
            echo "NPM_TOKEN secret not set; attempting OIDC token exchange..."
            TOKEN_RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")
            ID_TOKEN=$(echo "$TOKEN_RESP" | jq -r '.value // empty')
            if [ -z "$ID_TOKEN" ]; then
              echo "::error::Could not fetch OIDC ID token from GitHub Actions: $TOKEN_RESP"
              exit 1
            fi
            echo "::add-mask::$ID_TOKEN"
            EXCHANGE_RESP=$(curl -s -w "\n%{http_code}" -X POST "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/xyeena-agent" \
              -H "Authorization: Bearer $ID_TOKEN" \
              -H "Content-Type: application/json")
            HTTP_CODE=$(echo "$EXCHANGE_RESP" | tail -n1)
            BODY=$(echo "$EXCHANGE_RESP" | sed '$d')
            echo "npm exchange HTTP code: $HTTP_CODE"
            if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
              echo "::error::npm OIDC exchange failed with HTTP $HTTP_CODE: $BODY"
              exit 1
            fi
            NPM_SESSION_TOKEN=$(echo "$BODY" | jq -r '.token')
            echo "::add-mask::$NPM_SESSION_TOKEN"
            echo "//registry.npmjs.org/:_authToken=$NPM_SESSION_TOKEN" > "$HOME/.npmrc"
            echo "Successfully authenticated to npm via OIDC session token!"
          fi
      - name: Publish new package to npm with provenance
        if: steps.existing.outputs.published != 'true' && !startsWith(github.event.head_commit.message, 'verify: xyeena-agent v0.3.0')
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Wait for npm processing and verify public version
        timeout-minutes: 35
        run: |
          set -eu
          VERSION="$(node -p 'require("./package.json").version')"
          for attempt in $(seq 1 90); do
            FOUND="$(npm view "xyeena-agent@$VERSION" version --registry=https://registry.npmjs.org/ --prefer-online --fetch-retries=0 2>/dev/null || true)"
            if [ "$FOUND" = "$VERSION" ]; then
              echo "Verified xyeena-agent@$VERSION on public npm registry (attempt $attempt)."
              exit 0
            fi
            echo "npm has accepted this version but public metadata is not yet visible (attempt $attempt/90)."
            sleep 20
          done
          echo "::error::Package not publicly visible after 30 minutes. It may still be processing or require maintainer action in npm."
          exit 1
      - name: Test fresh consumer installation from npm registry
        run: |
          set -eu
          VERSION="$(node -p 'require("./package.json").version')"
          TMP="$(mktemp -d)"
          cd "$TMP"
          FOUND="$(npm exec --yes --package="xyeena-agent@$VERSION" -- xyeena version)"
          if [ "$FOUND" != "$VERSION" ]; then
            echo "::error::Fresh registry install reported $FOUND, expected $VERSION"
            exit 1
          fi
      - name: Create GitHub Release for one-time v0.3.0 main push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="$(node -p 'require("./package.json").version')"
          gh release view "v$VERSION" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --target "a5e7dfb43b3e342a8f589ce7c9b7d95edd4b8782" \
              --title "v$VERSION — Portable Xyeena Rig and safe beginner setup" \
              --generate-notes
