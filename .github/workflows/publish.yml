name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - name: Validate release tag and package version
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run test:harness
      - run: npm run test:consumer
      - run: npm run check
      - run: npm run eval
      - run: npm pack --dry-run
      - name: Prepare npm OIDC environment
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "NPM_CONFIG_USERCONFIG: $NPM_CONFIG_USERCONFIG"
          if [ -f "$npmrc" ]; then
            echo "Current npmrc content:"
            cat "$npmrc"
            sed -i '/_authToken/d' "$npmrc"
          fi
          echo "Fetching OIDC ID token with audience npm:registry.npmjs.org..."
          TOKEN_RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")
          ID_TOKEN=$(echo "$TOKEN_RESP" | jq -r '.value // empty')
          if [ -z "$ID_TOKEN" ]; then
            echo "::error::Could not fetch OIDC ID token from GitHub Actions: $TOKEN_RESP"
            exit 1
          fi
          echo "::add-mask::$ID_TOKEN"
          echo "NPM_ID_TOKEN=$ID_TOKEN" >> "$GITHUB_ENV"
          PAYLOAD=$(echo "$ID_TOKEN" | cut -d. -f2)
          # Add base64 padding if needed
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "Sanitized OIDC claims:"
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{iss, sub, aud, repository, repository_owner, ref, workflow_ref}' || true
      - run: npm publish --provenance
