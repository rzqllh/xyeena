name: publish
# An explicitly published GitHub Release is the only publication trigger.
# There is NO main push/commit-message triggered npm release.
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: xyeena-npm-publish
  cancel-in-progress: false
jobs:
  npm:
    if: >-
      github.event_name == 'release' &&
      github.event.release.draft == false &&
      github.event.release.prerelease == false &&
      github.repository == 'rzqllh/xyeena'
    runs-on: ubuntu-latest
    # Required reviewers MUST be configured in GitHub Settings > Environments
    # before enabling a public release. An unprotected environment alone does
    # not imply approval; document that truthfully.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.1
      - name: Verify release tag matches package and current main exactly
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = release
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REPOSITORY" = rzqllh/xyeena
          VERSION="$(node -p 'require("./package.json").version')"
          test -n "$VERSION"
          test "$GITHUB_REF_NAME" = "v$VERSION" || {
            echo "::error::Release tag does not match checked-out package version"
            exit 1
          }
          # Reject old, unmerged or side-branch tags, even if someone publishes
          # a GitHub Release for them. Pin to the current reviewed main HEAD.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          EXPECTED="$(git rev-parse refs/remotes/origin/main)"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$GITHUB_SHA"
          test "$ACTUAL" = "$EXPECTED" || {
            echo "::error::Release ref is not the current main commit"
            exit 1
          }
          # Exact version must be immutable at registry: do not overwrite.
          if npm view "xyeena-agent@$VERSION" version --registry=https://registry.npmjs.org/ --prefer-online --fetch-retries=0 2>/dev/null | grep -Fx "$VERSION"; then
            echo "::error::This exact npm version is already published; no upload performed"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run test:harness
      - run: npm run test:consumer
      - run: npm run check
      - run: npm run eval
      - run: npm pack --dry-run
      - name: Publish via npm trusted publisher OIDC, with provenance
        # No NPM_TOKEN, no explicit OIDC token exchange, no persistent .npmrc.
        run: npm publish --provenance --access public
      - name: Verify exact version becomes public
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          for attempt in $(seq 1 90); do
            FOUND="$(npm view "xyeena-agent@$VERSION" version --registry=https://registry.npmjs.org/ --prefer-online --fetch-retries=0 2>/dev/null || true)"
            if [ "$FOUND" = "$VERSION" ]; then
              echo "Exact public npm version verified."
              exit 0
            fi
            sleep 20
          done
          echo "::error::New version is not yet visible in npm registry"
          exit 1
      - name: Verify fresh npm consumer install
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          TMP="$(mktemp -d)"
          cd "$TMP"
          FOUND="$(npm exec --yes --package="xyeena-agent@$VERSION" -- xyeena version)"
          test "$FOUND" = "$VERSION"
